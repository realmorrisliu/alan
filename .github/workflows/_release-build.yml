name: Release Build (Reusable)

on:
  workflow_call:
    inputs:
      version:
        description: "Pure SemVer release version (e.g. 0.1.5 or 0.1.6-beta.20261123.42)"
        type: string
        required: true
      tag:
        description: "Git release tag (e.g. v0.1.5 or beta)"
        type: string
        required: true
      channel:
        description: "Release channel (stable or beta)"
        type: string
        required: true
      commit_sha:
        description: "Optional short Git commit SHA embedded in build and manifest"
        type: string
        required: false
        default: ""
      target_sha:
        description: "Full Git commit SHA to check out and tag"
        type: string
        required: false
        default: ""
      should_publish:
        description: "Whether to publish assets to GitHub Releases"
        type: boolean
        required: true
      should_sign_macos:
        description: "Whether to Apple Developer ID sign and notarize macOS binaries"
        type: boolean
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            platform: macos
          - target: x86_64-apple-darwin
            os: macos-latest
            platform: macos
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            platform: linux
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            platform: linux
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_sha || github.sha }}

      - name: Validate workflow inputs
        env:
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          case "$RELEASE_CHANNEL" in
            stable|beta) ;;
            *)
              echo "invalid channel: $RELEASE_CHANNEL" >&2
              exit 1
              ;;
          esac
          test -n "$RELEASE_VERSION"
          test -n "$RELEASE_TAG"

      - name: Require Apple signing and notarization secrets
        if: matrix.platform == 'macos' && inputs.should_sign_macos
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_P12_PASSWORD: ${{ secrets.MACOS_CERT_P12_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          missing=0
          for name in MACOS_CERT_P12_BASE64 MACOS_CERT_P12_PASSWORD APPLE_TEAM_ID ASC_API_KEY_P8 ASC_API_KEY_ID ASC_API_ISSUER_ID; do
            eval "value=\${$name-}"
            if [ -z "$value" ]; then
              echo "missing secret: $name" >&2
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
          cache-bin: false

      - name: Install Linux ARM64 cross-compiler
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Build, sign, notarize, and package (macOS)
        if: matrix.platform == 'macos' && inputs.should_sign_macos
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_P12_PASSWORD: ${{ secrets.MACOS_CERT_P12_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RELEASE_COMMIT: ${{ inputs.commit_sha }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/alan-signing"
          mkdir -p "$work"
          keychain="$work/signing.keychain-db"
          p12="$work/cert.p12"
          p8="$work/AuthKey.p8"
          pass="$(openssl rand -base64 32)"
          cleanup() {
            security delete-keychain "$keychain" >/dev/null 2>&1 || true
            rm -f "$p12" "$p8" "$work/import.err"
          }
          trap cleanup EXIT

          printf '%s' "$MACOS_CERT_P12_BASE64" | tr -d '[:space:]' | base64 --decode > "$p12"
          magic="$(xxd -p -l 1 "$p12" || true)"
          if [ "$magic" != "30" ]; then
            echo "MACOS_CERT_P12_BASE64 did not decode to a PKCS#12 certificate" >&2
            exit 1
          fi

          if printf '%s' "$ASC_API_KEY_P8" | grep -q "BEGIN "; then
            printf '%s\n' "$ASC_API_KEY_P8" > "$p8"
          else
            printf '%s' "$ASC_API_KEY_P8" | tr -d '[:space:]' | base64 --decode > "$p8"
          fi
          if ! grep -q "PRIVATE KEY" "$p8"; then
            echo "ASC_API_KEY_P8 is not a PEM private key" >&2
            exit 1
          fi
          chmod 600 "$p12" "$p8"

          security create-keychain -p "$pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$pass" "$keychain"
          set +e
          security import "$p12" -k "$keychain" -P "$MACOS_CERT_P12_PASSWORD" -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security >/dev/null 2>"$work/import.err"
          status=$?
          if [ "$status" -ne 0 ]; then
            trimmed="$(printf '%s' "$MACOS_CERT_P12_PASSWORD" | sed -e 's/[[:space:]]*$//')"
            security import "$p12" -k "$keychain" -P "$trimmed" -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security >/dev/null 2>"$work/import.err"
            status=$?
          fi
          set -e
          if [ "$status" -ne 0 ]; then
            echo "could not import MACOS_CERT_P12_BASE64 with MACOS_CERT_P12_PASSWORD" >&2
            exit 1
          fi
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$pass" "$keychain" >/dev/null

          existing_keychains=()
          while IFS= read -r kc; do
            [ -n "$kc" ] && existing_keychains+=("$kc")
          done < <(security list-keychains -d user | tr -d '"' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')
          security list-keychains -d user -s "$keychain" "${existing_keychains[@]}"

          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -n 1)"
          if [ -z "$identity" ]; then
            echo "no Developer ID Application identity in the imported certificate" >&2
            exit 1
          fi
          echo "signing identity: $identity"
          if ! printf '%s' "$identity" | grep -q "($APPLE_TEAM_ID)"; then
            echo "imported identity is not for APPLE_TEAM_ID" >&2
            exit 1
          fi

          export ALAN_TARGET="$RELEASE_TARGET"
          export ALAN_RELEASE_VERSION="$RELEASE_VERSION"
          export ALAN_BUILD_VERSION="$RELEASE_VERSION"
          export ALAN_BUILD_CHANNEL="$RELEASE_CHANNEL"
          export ALAN_BUILD_COMMIT="$RELEASE_COMMIT"
          export ALAN_RELEASE_OUT_DIR="$PWD/dist"
          export ALAN_SIGN_IDENTITY="$identity"
          export ALAN_SIGN_KEYCHAIN="$keychain"
          export ALAN_NOTARY_KEY="$p8"
          export ALAN_NOTARY_KEY_ID="$ASC_API_KEY_ID"
          export ALAN_NOTARY_ISSUER="$ASC_API_ISSUER_ID"
          export ALAN_SIGN_PROOF_OUT="$PWD/dist/signing-proof-${RELEASE_TARGET}.txt"
          export ALAN_NOTARY_JSON_OUT="$PWD/dist/notary-${RELEASE_TARGET}.json"
          export ALAN_REQUIRE_NOTARIZE=1
          ./scripts/assemble-cli-release.sh

      - name: Build and package (unsigned / Linux)
        if: matrix.platform != 'macos' || !inputs.should_sign_macos
        env:
          ALAN_TARGET: ${{ matrix.target }}
          ALAN_RELEASE_VERSION: ${{ inputs.version }}
          ALAN_BUILD_VERSION: ${{ inputs.version }}
          ALAN_BUILD_CHANNEL: ${{ inputs.channel }}
          ALAN_BUILD_COMMIT: ${{ inputs.commit_sha }}
          ALAN_RELEASE_OUT_DIR: ${{ github.workspace }}/dist
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
        run: ./scripts/assemble-cli-release.sh

      - name: Verify notarization acceptance (macOS)
        if: matrix.platform == 'macos' && inputs.should_sign_macos
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          proof="dist/signing-proof-${RELEASE_TARGET}.txt"
          notary="dist/notary-${RELEASE_TARGET}.json"
          test -f "$proof"
          test -f "$notary"
          grep -F -q "signed=true" "$proof"
          grep -F -q "notarized=true" "$proof"
          python3 - "$notary" <<'PY'
          import json
          import pathlib
          import sys

          raw = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")
          data = json.loads(raw[raw.find("{"):])
          print("notary id=" + str(data.get("id")))
          print("notary status=" + str(data.get("status")))
          if data.get("status") != "Accepted":
              sys.exit(1)
          PY

      - name: Verify packaged archive and checksum
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          asset="alan-${RELEASE_VERSION}-${RELEASE_TARGET}.tar.gz"
          test -f "dist/${asset}"
          test -f "dist/${asset}.sha256"
          if command -v shasum >/dev/null 2>&1; then
            (cd dist && shasum -a 256 -c "${asset}.sha256")
          else
            (cd dist && sha256sum -c "${asset}.sha256")
          fi
          listing="$(tar -tzf "dist/${asset}")"
          echo "$listing"
          printf '%s\n' "$listing" | grep -F -q "./alan"
          printf '%s\n' "$listing" | grep -F -q "./manifest.json"
          if printf '%s\n' "$listing" | grep -Eq 'alan-dev|alan-os-host'; then
            echo "forbidden legacy executable found in archive" >&2
            exit 1
          fi
          if [ "${RELEASE_TARGET}" = "x86_64-unknown-linux-gnu" ] || [ "${RELEASE_TARGET}" = "aarch64-apple-darwin" ]; then
            smoke_dir="$(mktemp -d)"
            tar -xzf "dist/${asset}" -C "$smoke_dir" ./alan
            "$smoke_dir/alan" --version
            short_ver="$("$smoke_dir/alan" -V)"
            test "$short_ver" = "alan $RELEASE_VERSION"
            if [ "$RELEASE_CHANNEL" = "beta" ]; then
              "$smoke_dir/alan" --version | grep -F -q "beta"
            fi
            rm -rf "$smoke_dir"
          fi

      - name: Upload target release artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.target }}
          path: dist/
          if-no-files-found: warn

  release:
    name: Manifest & Publish Release
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_sha || github.sha }}

      - name: Download built target artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: release-assets
          merge-multiple: true

      - name: Generate latest.json and checksums.txt
        env:
          VERSION: ${{ inputs.version }}
          TAG: ${{ inputs.tag }}
          CHANNEL: ${{ inputs.channel }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
          REPO: ${{ github.repository }}
          SHOULD_SIGN_MACOS: ${{ inputs.should_sign_macos }}
        run: |
          set -euo pipefail
          extra_flags=()
          if [ "$SHOULD_SIGN_MACOS" = "true" ]; then
            extra_flags+=(--require-apple-notarized)
          fi
          if [ -n "${COMMIT_SHA:-}" ]; then
            extra_flags+=(--commit "$COMMIT_SHA")
          fi
          python3 scripts/generate-release-manifest.py \
            --assets-dir release-assets \
            --version "$VERSION" \
            --tag "$TAG" \
            --channel "$CHANNEL" \
            --repo "$REPO" \
            --verify-archives \
            "${extra_flags[@]}"
          (cd release-assets && sha256sum -c checksums.txt)
          cat release-assets/latest.json
          cat release-assets/checksums.txt

      - name: Upload combined release bundle
        uses: actions/upload-artifact@v7
        with:
          name: alan-${{ inputs.channel }}-${{ inputs.version }}-release-bundle
          path: release-assets/
          if-no-files-found: error

      - name: Publish GitHub Release
        if: inputs.should_publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
          TARGET_SHA: ${{ inputs.target_sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          payload_assets=(
            release-assets/alan-"${VERSION}"-*.tar.gz
            release-assets/alan-"${VERSION}"-*.tar.gz.sha256
            release-assets/signing-proof-*.txt
            release-assets/notary-*.json
          )
          manifest_assets=(
            release-assets/latest.json
            release-assets/checksums.txt
          )
          if [ "${#payload_assets[@]}" -eq 0 ] || [ "${#manifest_assets[@]}" -ne 2 ]; then
            echo "Missing release assets to publish" >&2
            exit 1
          fi

          if [ "$CHANNEL" = "beta" ]; then
            git tag -f beta "$TARGET_SHA"
            git push origin refs/tags/beta --force

            if gh release view beta >/dev/null 2>&1; then
              gh release upload beta "${payload_assets[@]}" --clobber
              gh release upload beta "${manifest_assets[@]}" --clobber
              gh release edit beta --draft=false --prerelease=true --target "$TARGET_SHA" --title "Alan Beta"
            else
              gh release create beta "${payload_assets[@]}" \
                --title "Alan Beta" \
                --notes "Rolling beta pre-release builds from \`main\`." \
                --prerelease \
                --verify-tag
              gh release upload beta "${manifest_assets[@]}" --clobber
            fi

            python3 - <<'PY'
          import json
          import os
          import re
          import subprocess

          current_version = os.environ["VERSION"]
          targets = (
              "aarch64-apple-darwin",
              "x86_64-apple-darwin",
              "x86_64-unknown-linux-gnu",
              "aarch64-unknown-linux-gnu",
          )
          asset_re = re.compile(
              r"^alan-(.+)-(" + "|".join(re.escape(t) for t in targets) + r")\.tar\.gz(?:\.sha256)?$"
          )

          def semver_key(ver: str):
              try:
                  core_pre = ver.split("+", 1)[0]
                  core, _, pre = core_pre.partition("-")
                  major, minor, patch = (int(part) for part in core.split("."))
                  pre_key = []
                  if pre:
                      for part in pre.split("."):
                          if part.isdigit():
                              pre_key.append((0, int(part), ""))
                          else:
                              pre_key.append((1, 0, part))
                  return (1, major, minor, patch, 1 if not pre else 0, pre_key)
              except Exception:
                  return (0, 0, 0, 0, 0, [(1, 0, ver)])

          raw = subprocess.check_output(
              ["gh", "release", "view", "beta", "--json", "assets"],
              text=True,
          )
          asset_names = [item["name"] for item in json.loads(raw).get("assets", [])]
          versions_to_assets: dict[str, list[str]] = {}
          for name in asset_names:
              match = asset_re.match(name)
              if match:
                  versions_to_assets.setdefault(match.group(1), []).append(name)

          other_versions = sorted(
              (ver for ver in versions_to_assets if ver != current_version),
              key=semver_key,
              reverse=True,
          )
          keep_versions = {current_version}
          if other_versions:
              keep_versions.add(other_versions[0])

          to_delete = [
              name
              for ver, names in sorted(versions_to_assets.items())
              if ver not in keep_versions
              for name in sorted(names)
          ]
          print(f"Keeping beta asset versions: {sorted(keep_versions)}")
          for name in to_delete:
              print(f"Pruning old beta asset: {name}")
              subprocess.run(
                  ["gh", "release", "delete-asset", "beta", name, "--yes"],
                  check=True,
              )
          PY
          else
            prerelease_flags=()
            edit_prerelease_flags=(--prerelease=false)
            if [[ "$VERSION" == *-* ]]; then
              prerelease_flags+=(--prerelease)
              edit_prerelease_flags=(--prerelease=true)
            fi
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" "${payload_assets[@]}" --clobber
              gh release upload "$TAG" "${manifest_assets[@]}" --clobber
              gh release edit "$TAG" --draft=false "${edit_prerelease_flags[@]}"
            else
              create_flags=(--title "$TAG" --generate-notes)
              if [ "$EVENT_NAME" = "push" ]; then
                create_flags+=(--verify-tag)
              else
                create_flags+=(--target "$TARGET_SHA")
              fi
              gh release create "$TAG" "${payload_assets[@]}" "${create_flags[@]}" "${prerelease_flags[@]}"
              gh release upload "$TAG" "${manifest_assets[@]}" --clobber
            fi
          fi
