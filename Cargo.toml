[workspace]
resolver = "2"
members = [
    "crates/ap",
    "crates/agentfs",
    "crates/auth",
    "crates/kernel",
    "crates/knowledge",
    "crates/memfs",
    "crates/hostfs",
    "crates/routefs",
    "crates/editfs",
    "crates/branchfs",
    "crates/agent-protocol",
    "crates/llm",
    "crates/llmfs",
    "crates/os-host",
    "crates/agent-engine",
    "crates/agent-engine/skills/swebench/tooling",
    "crates/shell",
    "crates/shell-core",
    "crates/shell-core-ffi",
    "crates/tools",
    "crates/tui",
    "crates/alan",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Morris Liu"]
license = "Apache-2.0"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.52", features = ["full"] }
tokio-util = "0.7"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
jsonschema = "0.46"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# SSE streaming
eventsource-stream = "0.2"
futures-core = "0.3"
pin-utils = "0.1"

# UUID
uuid = { version = "1.23", features = ["v4", "serde"] }

# HTTP client
reqwest = { version = "0.13.4", default-features = false, features = [
    "json",
    "stream",
    "charset",
    "http2",
    "default-tls",
] }

# Async utilities
futures = "0.3"
async-trait = "0.1"
libc = "0.2"

# URL encoding
urlencoding = "2.1"
url = "2.5"
base64 = "0.22"

# Web framework
axum = "0.8"

# Date/time handling
chrono = { version = "0.4", features = ["serde"] }

# Home directory detection
dirs = "6.0"

# Terminal utilities
textwrap = "0.16"
crossterm = "0.29"
ratatui = "0.30"
unicode-width = "0.2"
vt100 = "0.16"

# Testing
tempfile = "3"

# Random number generation for jitter
rand = "0.10"

# Cryptography
sha2 = "0.11"
hex = "0.4"

# Path utilities
dunce = "1.0"
include_dir = "0.7"

# Regular expressions
regex = "1"

# Internal crates
alan-auth = { path = "crates/auth" }
alan-agent-protocol = { path = "crates/agent-protocol" }
alan-llm = { path = "crates/llm" }
alan-agent-engine = { path = "crates/agent-engine" }
alan-knowledge = { path = "crates/knowledge" }
alan-memfs = { path = "crates/memfs" }
alan-hostfs = { path = "crates/hostfs" }
alan-routefs = { path = "crates/routefs" }
alan-os-host = { path = "crates/os-host" }
alan-editfs = { path = "crates/editfs" }
alan-branchfs = { path = "crates/branchfs" }
alan-swebench-tooling = { path = "crates/agent-engine/skills/swebench/tooling" }
alan-shell-core = { path = "crates/shell-core" }
alan-shell-core-ffi = { path = "crates/shell-core-ffi" }
alan-tools = { path = "crates/tools" }
alan-terminal-ui = { path = "crates/tui" }
