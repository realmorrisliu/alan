[package]
name = "alan"
description = "alan — AI Turing Machine CLI & daemon"
version.workspace = true
edition.workspace = true

[lib]
name = "alan"
path = "src/lib.rs"

[[bin]]
name = "alan"
path = "src/main.rs"

[dependencies]
alan-auth.workspace = true
alan-kernel.workspace = true
alan-protocol.workspace = true
alan-runtime.workspace = true
alan-swebench-tooling.workspace = true
alan-tools.workspace = true
alan-terminal-ui.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
futures.workspace = true
tokio-stream.workspace = true
dirs.workspace = true
chrono.workspace = true
sha2.workspace = true
clap = { version = "4", features = ["derive"] }
reqwest.workspace = true
tokio-tungstenite = "0.29"
toml = "1.1"
urlencoding.workspace = true

[dev-dependencies]
alan-llm = { workspace = true, features = ["mock"] }
alan-runtime = { workspace = true, features = ["mock"] }
async-trait.workspace = true
base64.workspace = true
tempfile.workspace = true
