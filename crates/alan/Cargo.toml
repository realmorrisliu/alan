[package]
name = "alan"
description = "Alan command-line Host client and file-native Shell"
version.workspace = true
edition.workspace = true

[lib]
name = "alan"
path = "src/lib.rs"

[[bin]]
name = "alan"
path = "src/main.rs"

[dependencies]
alan-auth.workspace = true
alan-ap = { path = "../ap" }
alan-agent-protocol.workspace = true
alan-agent-engine.workspace = true
alan-kernel = { path = "../kernel" }
alan-os-host.workspace = true
alan-shell = { path = "../shell" }
alan-swebench-tooling.workspace = true
alan-tools.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
dirs.workspace = true
chrono.workspace = true
sha2.workspace = true
clap = { version = "4", features = ["derive"] }
reqwest.workspace = true
toml = "1.1"
urlencoding.workspace = true

[dev-dependencies]
alan-llm = { workspace = true, features = ["mock"] }
alan-agent-engine = { workspace = true, features = ["mock"] }
async-trait.workspace = true
base64.workspace = true
tempfile.workspace = true
