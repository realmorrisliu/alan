[package]
name = "alan-llm"
description = "LLM providers and protocol adapters for alan"
version.workspace = true
edition.workspace = true

[features]
default = [
    "provider-anthropic",
    "provider-chatgpt",
    "provider-gemini",
    "provider-openai",
    "provider-openrouter",
    "provider-typesafe",
]
mock = []
http = [
    "dep:reqwest",
    "dep:eventsource-stream",
    "dep:futures-core",
    "dep:pin-utils",
]
provider-openai = ["http"]
provider-anthropic = ["http"]
provider-gemini = ["http"]
provider-chatgpt = ["http", "dep:alan-auth"]
provider-openrouter = ["http", "dep:openrouter-rs"]
provider-typesafe = ["http"]

[dependencies]
alan-auth = { workspace = true, optional = true }
alan-agent-protocol.workspace = true
anyhow.workspace = true
async-trait.workspace = true
futures.workspace = true
openrouter-rs = { version = "0.25.0", optional = true }
reqwest = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

# SSE streaming
eventsource-stream = { workspace = true, optional = true }
futures-core = { workspace = true, optional = true }
pin-utils = { workspace = true, optional = true }

[dev-dependencies]
axum.workspace = true
base64.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["full"] }
