[package]
name = "alan-llm"
description = "LLM providers and protocol adapters for alan"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["all-providers"]
all-providers = [
    "provider-magpie",
    "provider-openai",
    "provider-vertex",
    "provider-openrouter",
    "provider-anthropic-adapter",
]
provider-magpie = []
provider-openai = ["dep:tokio-tungstenite"]
provider-vertex = []
provider-openrouter = ["dep:openrouter-rs"]
provider-anthropic-adapter = []
mock = []

[dependencies]
alan-auth.workspace = true
alan-agent-protocol.workspace = true
anyhow.workspace = true
async-trait.workspace = true
futures.workspace = true
openrouter-rs = { version = "0.25.0", optional = true }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tokio-tungstenite = { workspace = true, optional = true }

# SSE streaming
eventsource-stream.workspace = true
futures-core.workspace = true

[dev-dependencies]
axum.workspace = true
base64.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["full"] }
