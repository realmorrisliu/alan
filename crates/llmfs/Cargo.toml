[package]
name = "alan-llmfs"
description = "alan-llmfs — the LLM file server: serves callable Connections at /mnt/llm, modeling a Generation as a clone-via-open directory (data → events token stream). Wraps alan-llm; speaks aP."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
alan-ap = { path = "../ap" }
alan-llm = { path = "../llm", default-features = false }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true }

[dev-dependencies]
alan-llm = { path = "../llm", default-features = false, features = [
    "mock",
    "provider-anthropic",
    "provider-openai",
    "provider-openrouter",
    "provider-typesafe",
] }
anyhow.workspace = true
async-trait.workspace = true
