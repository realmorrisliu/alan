# Non-secret adapter metadata for the Anthropic Messages API extension provider package.
# Credentials and API keys MUST live exclusively in Host Store (`SecretStore`) and are never
# embedded in Quartermaster packages or manifests.

protocol = "anthropic_messages"
messages_path = "/v1/messages"
auth_mode = "header_api_key"
api_key_header = "x-api-key"
anthropic_version = "2023-06-01"
