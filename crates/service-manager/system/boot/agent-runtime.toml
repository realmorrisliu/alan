name = "agent-runtime"
executable = "/bin/agent-runtime-service"
after = ["connection", "route"]
required = true
timeout_ms = 10000
restart = "on-failure"
restart_limit = 5
initial_backoff_ms = 100
max_backoff_ms = 1000
stable_reset_ms = 30000
published_handles = ["agent-runtime"]

[[mounts]]
path = "/proc"
source = "/proc"
access = "write"

[[mounts]]
path = "/agent"
source = "/agent"
access = "write"

[[mounts]]
path = "/srv"
source = "/srv"
access = "write"

[[mounts]]
path = "/bin/agent-runtime-service"
source = "/bin/agent-runtime-service"
access = "read"
