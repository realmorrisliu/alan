name = "route"
executable = "/bin/routefs"
after = []
required = true
timeout_ms = 5000
restart = "on-failure"
restart_limit = 5
initial_backoff_ms = 50
max_backoff_ms = 1000
stable_reset_ms = 30000
published_handles = ["route"]

[[mounts]]
path = "/proc"
source = "/proc"
access = "write"

[[mounts]]
path = "/srv"
source = "/srv"
access = "write"

[[mounts]]
path = "/bin/routefs"
source = "/bin/routefs"
access = "read"
